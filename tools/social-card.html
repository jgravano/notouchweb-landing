<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>NoTouchWeb social preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        color: #f2eee4;
        background: #17140f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 505px 695px;
        background: #17140f;
      }
      .copy {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        padding: 56px 54px 50px;
        border-right: 1px solid rgba(242, 238, 228, .18);
      }
      .brand {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        font-size: 31px;
        font-weight: 400;
        line-height: 1;
      }
      h1 {
        max-width: 390px;
        margin: auto 0 26px;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        font-size: 55px;
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: 0;
      }
      .lede {
        max-width: 360px;
        margin: 0;
        color: rgba(242, 238, 228, .72);
        font-size: 20px;
        line-height: 1.42;
      }
      .visual {
        position: relative;
        overflow: hidden;
        background: #241f17;
      }
      .visual img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: 52% center;
      }
      .url {
        position: absolute;
        right: 30px;
        bottom: 25px;
        margin: 0;
        padding: 9px 12px;
        color: #17140f;
        background: rgba(242, 238, 228, .9);
        font-size: 15px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="copy">
        <p class="brand">NoTouchWeb</p>
        <h1>Control the web without touching it.</h1>
        <p class="lede">Navigate, scroll, and interact with natural gestures.</p>
      </section>
      <section class="visual" aria-hidden="true">
        <img src="../assets/hero-desktop.webp" alt="" />
        <p class="url">notouchweb.com</p>
      </section>
    </main>
  </body>
</html>
